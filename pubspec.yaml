name: pos_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.11.0
  shared_preferences: ^2.5.5
  go_router: ^14.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.3
  material_symbols_icons: ^4.27.0
  responsive_builder: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Rudaw
      fonts:
        - asset: assets/fonts/rudawregular2.ttf
        - asset: assets/fonts/rudawbold.ttf
          weight: 700
